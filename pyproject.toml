[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "moose-inventory"
version = "2.1.0"
description = "Python CLI replacement for the Ruby moose-inventory tool."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Russ Davies" }
]
keywords = ["ansible", "inventory", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration"
]
dependencies = [
  "PyYAML>=6.0.2",
  "SQLAlchemy>=2.0"
]

[project.optional-dependencies]
mysql = ["PyMySQL>=1.1"]
postgresql = ["psycopg[binary]>=3.2"]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "twine>=5.0",
  "types-PyYAML>=6.0.12"
]

[project.scripts]
moose-inventory = "moose_inventory.cli:main"

[project.urls]
Homepage = "https://github.com/RusDavies/moose-inventory-python"
Repository = "https://github.com/RusDavies/moose-inventory-python"

[tool.hatch.build.targets.wheel]
packages = ["src/moose_inventory"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["moose_inventory"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = ["src"]
testpaths = ["tests"]
