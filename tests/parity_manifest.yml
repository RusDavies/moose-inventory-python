schema_version: 1
name: moose-inventory Ruby/Python CLI parity manifest
ruby_reference_root: ../moose-inventory
purpose: >-
  Command-level golden and structural parity cases extracted from the Ruby RSpec
  suite. Active cases are enforced by the Python compatibility harness now;
  pending cases become active as command families are ported.
normalization:
  - Replace each implementation's disposable run root with <RUN_ROOT>.
  - Use separate SQLite config/database roots per implementation.
  - Compare exact stdout/stderr/exit status for human-output cases unless compare.mode says otherwise.
  - Parse YAML/JSON for structural cases where field ordering is not compatibility-protected.
case_statuses:
  active: Python implementation should currently match Ruby.
  pending_python_port: Ruby behavior captured; activate when the command family is ported.
cases:
  - id: database-status-current
    status: active
    source: spec/lib/moose_inventory/db_lifecycle_spec.rb:21
    description: prints current database lifecycle status after startup migration
    args: [database, status]
    setup: []
    compare:
      mode: exact
    expected:
      returncode: 0
      stdout_contains:
        - "Adapter: sqlite3\n"
        - "Schema version: 4\n"
        - "Expected schema version: 4\n"
        - "- groups_tags: present\n"
      stderr: ""

